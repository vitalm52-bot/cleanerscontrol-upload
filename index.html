
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cleaners Control</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      margin: 0;
      padding: 25px;
      color: #263238;
    }

    .container {
      max-width: 500px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
      text-align: center;
    }

    h2 { margin-top: 0; }

    p { color: #64748b; }

    #googleButton {
      display: flex;
      justify-content: center;
      margin-top: 25px;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Cleaners Control</h2>
    <p>Sign in with your Google account to continue.</p>

    <div id="googleButton"></div>
    <div id="status"></div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID =
      '385603379228-7cjt4svu3edc5oo9ls79c6bvgtvcrlg0.apps.googleusercontent.com';

    function handleCredentialResponse(response) {
      document.getElementById('status').textContent =
        'Google sign-in successful. Preparing the photo upload...';

      // We will validate this credential securely on the backend
      // before allowing any photo upload.
      console.log('Google credential received.');
    }

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById('googleButton'),
        {
          theme: 'outline',
          size: 'large',
          shape: 'rectangular',
          text: 'signin_with',
          width: 280
        }
      );
    };
  </script>
</body>
</html>
